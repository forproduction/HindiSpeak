<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabulary Builder | HindiSpeak</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm border-bottom border-secondary border-opacity-25 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="../index.html">
                <span class="brand-icon d-inline-flex align-items-center justify-content-center rounded-3 bg-gradient text-white" style="width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);">
                    <i class="bi bi-translate"></i>
                </span>
                <span class="brand-text">Hindi<span class="text-warning">Speak</span></span>
            </a>

            <a href="../index.html" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-medium d-inline-flex align-items-center gap-2">
                <i class="bi bi-house-door"></i> Home
            </a>
        </div>
    </nav>


    <div class="container py-5">

        <!-- Page Heading -->
        <div class="text-center mb-5 p-4 rounded-4 bg-white shadow-sm border">
            <!-- <span class="badge bg-warning-subtle text-warning fw-bold px-3 py-1 rounded-pill text-uppercase tracking-wider mb-2">Lexicon</span> -->
            <h2 class="fw-bold fs-2 text-dark">Vocabulary Builder</h2>
            <p class="text-muted mb-0">
                Build your Hindi vocabulary one word at a time.
            </p>
        </div>


        <!-- Search and Filters -->
        <div class="row mb-4 g-3">

            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0 ps-0 shadow-none"
                        placeholder="Search Hindi, Roman Hindi or English...">
                </div>
            </div>

            <div class="col-md-4">
                <select id="categoryFilter" class="form-select shadow-none">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <div class="col-md-3">
                <button id="favouriteFilter" class="btn btn-outline-danger w-100 fw-medium d-inline-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-heart-fill"></i> Show Favourites
                </button>
            </div>

        </div>

        <!-- Vocabulary Source -->
        <!-- <div class="mb-4">

            <label class="form-label fw-semibold">
                Vocabulary Source
            </label>

            <select id="sourceFilter" class="form-select">
                <option value="all">All Vocabulary</option>
                <option value="lesson">Lesson Vocabulary</option>
                <option value="thematic">Thematic Vocabulary</option>
            </select>

        </div> -->


        <!-- Vocabulary Count -->
        <div class="d-flex justify-content-between align-items-center mb-3 px-1">
            <h5 class="fw-bold mb-0 text-dark">Available Words</h5>
            <span id="wordCount" class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2 rounded-pill"></span>
        </div>


        <!-- Vocabulary Cards -->
        <div class="row g-4" id="vocabularyContainer">

            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted fw-medium">Loading vocabulary...</p>
            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="text-center py-4 bg-dark text-white-50 border-top border-secondary border-opacity-25 mt-5">
        <div class="container">
            <p class="mb-0 small">© 2026 HindiSpeak | Built with care for friends to learn together</p>
        </div>
    </footer>


    <script src="../js/vocabulary.js"></script>
    <script src="../js/notepad.js"></script>

</body>

</html>
