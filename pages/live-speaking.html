<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Hindi Practice - Spoken Course</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">Spoken Course</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="lessons.html">Lessons</a></li>
                    <li class="nav-item"><a class="nav-link" href="vocabulary.html">Vocabulary</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="live-speaking.html">Live Speaking</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-4 flex-grow-1" style="max-width: 800px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 fw-bold text-dark mb-1">Live Hindi Speaking Practice</h1>
                <p class="text-muted mb-4">Select a scenario, click the microphone button, and practice speaking in Hindi.</p>

                <!-- Scenario Selector -->
                <div class="mb-4">
                    <label for="scenarioSelect" class="form-label fw-semibold">Choose Scenario:</label>
                    <select id="scenarioSelect" class="form-select form-select-lg">
                        <option value="dhaba">Dhaba Food Ordering (ढाबा)</option>
                        <option value="market">Bargaining at Market (सब्जी मंडी)</option>
                        <option value="directions">Asking Directions (रास्ता पूछना)</option>
                    </select>
                </div>

                <!-- Chat / Dialogue Box -->
                <div id="chatContainer" class="border rounded bg-white p-3 mb-4 d-flex flex-column gap-3 overflow-auto" style="height: 380px;">
                    <div class="alert alert-secondary text-center mb-0 p-2 small" role="alert">
                        Click "Start Speaking" to open the audio session.
                    </div>
                </div>

                <!-- Audio Controls -->
                <div class="d-flex align-items-center gap-3">
                    <button id="micBtn" class="btn btn-primary btn-lg px-4 d-flex align-items-center gap-2">
                        <span>🎤</span> <span id="btnText">Start Speaking</span>
                    </button>
                    <span id="statusText" class="badge bg-secondary fs-6 fw-normal px-3 py-2">Idle</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/live-speaking.js"></script>
</body>
</html>
