<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Lessons | HindiSpeak</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm border-bottom border-secondary border-opacity-25 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="../index.html">
            <span class="brand-icon d-inline-flex align-items-center justify-content-center rounded-3 bg-gradient text-white" style="width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);">
                <i class="bi bi-translate"></i>
            </span>
            <span class="brand-text">Hindi<span class="text-warning">Speak</span></span>
        </a>
        <a class="btn btn-outline-light btn-sm rounded-pill px-3 fw-medium d-inline-flex align-items-center gap-2" href="../index.html">
            <i class="bi bi-house-door"></i> Home
        </a>
    </div>
</nav>

<main class="container py-5">

    <!-- Course Header & Progress Tracker -->
    <div class="mb-4 p-4 rounded-4 bg-white shadow-sm border">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <div>
                <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-1 rounded-pill text-uppercase tracking-wider mb-2">Interactive Module</span>
                <h1 id="courseTitle" class="fw-bold fs-3 mb-1">Hindi Lessons</h1>
                <p class="text-muted mb-0" id="courseInfo">Loading course...</p>
            </div>
            <div class="text-lg-end">
                <span class="text-secondary small d-block">Course progress</span>
                <span id="progressText" class="fw-bold fs-5 text-primary">0% completed</span>
            </div>
        </div>

        <div class="progress mt-3 rounded-pill bg-light" style="height: 10px;">
            <div id="progressBar"
                 class="progress-bar bg-gradient rounded-pill"
                 role="progressbar"
                 style="width: 0%; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);">
            </div>
        </div>
    </div>

    <div class="row g-4">

        <!-- Lesson list sidebar -->
        <aside class="col-lg-3">
            <div class="lesson-sidebar">
                <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                    <i class="bi bi-list-task text-primary fs-5"></i>
                    <h5 class="mb-0 fw-bold fs-6">Course Lessons</h5>
                </div>
                <div id="lessonList">
                    Loading lessons...
                </div>
            </div>
        </aside>

        <!-- Lesson content section -->
        <section class="col-lg-9">

            <div id="lessonContent" class="lesson-section shadow-sm">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted fw-medium">Loading lesson...</p>
                </div>
            </div>

            <!-- Action Navigation Buttons -->
            <div class="d-flex justify-content-between align-items-center mt-4 gap-2">
                <button id="previousBtn" class="btn btn-outline-secondary px-4 rounded-pill fw-medium d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Previous
                </button>

                <button id="completeBtn" class="btn btn-success px-4 rounded-pill fw-bold shadow-sm d-inline-flex align-items-center gap-2">
                    <i class="bi bi-check2-circle"></i> Mark as Completed
                </button>

                <button id="nextBtn" class="btn btn-primary px-4 rounded-pill fw-medium d-inline-flex align-items-center gap-1">
                    Next Lesson <i class="bi bi-arrow-right"></i>
                </button>
            </div>

        </section>
    </div>

</main>

<!-- Footer -->
<footer class="text-center py-4 bg-dark text-white-50 border-top border-secondary border-opacity-25 mt-5">
    <div class="container">
        <p class="mb-0 small">© 2026 HindiSpeak | Built with care for friends to learn together</p>
    </div>
</footer>

<script src="../js/lessons.js"></script>
<script src="../js/notepad.js"></script>
</body>
</html>
